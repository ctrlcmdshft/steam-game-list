<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="evlsmurf's extra games — a shareable Steam game list with direct Steam and store links.">
  <title>evlsmurf's extra games</title>
  <style>
    :root { color-scheme: dark; --bg:#101722; --panel:#182331; --panel2:#223346; --text:#eaf3fb; --muted:#a4b7c9; --blue:#66c0f4; --green:#a4d007; --line:#30465b; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--text); background:radial-gradient(900px 500px at 90% -10%,#254d69 0,transparent 62%),var(--bg); }
    .wrap { width:min(1180px,calc(100% - 32px)); margin:auto; }
    header { padding:48px 0 28px; }
    h1 { margin:0; color:#eaf3fb; font-size:clamp(2rem,5vw,3.75rem); letter-spacing:-.045em; }
    a { font:inherit; }
    .summary { display:flex; justify-content:space-between; gap:16px; margin:20px 0 12px; color:var(--muted); font-size:.9rem; }
    #games { display:grid; gap:14px; padding-bottom:40px; }
    .game { overflow:hidden; display:grid; grid-template-columns:minmax(145px,23%) minmax(250px,1fr) minmax(230px,33%); min-width:0; background:linear-gradient(115deg,#1c2d3a,#101e26 58%,#091116); border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 20px #0002; transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease; }
    .game:hover { transform:translateY(-3px); border-color:#5683a4; box-shadow:0 14px 26px #0005; }
    .cover { display:block; position:relative; min-height:205px; background:linear-gradient(135deg,#294764,#142433); overflow:hidden; }
    .cover img { width:100%; height:100%; object-fit:cover; display:block; }
    .cover:after { content:"EXTRA GAME"; position:absolute; top:10px; left:10px; padding:3px 8px; color:#10212c; background:var(--blue); font-size:.68rem; font-weight:800; letter-spacing:.08em; pointer-events:none; }
    .cover-title { display:none; position:absolute; inset:0; z-index:1; align-items:flex-end; padding:20px 14px; color:#e8f6ff; background:radial-gradient(circle at 85% 10%,#2c6d98 0,transparent 42%),linear-gradient(145deg,#172d42,#071019); font-size:1.25rem; font-weight:800; line-height:1.12; }
    .cover.no-art .cover-title { display:flex; }
    .card-body { display:flex; min-width:0; flex-direction:column; gap:7px; padding:13px 14px 11px; }
    .title { margin:0; font-size:1.08rem; font-weight:750; overflow-wrap:anywhere; }
    .badge { display:inline-block; margin-left:8px; padding:2px 7px; border-radius:99px; color:#182600; background:var(--green); font-size:.76rem; font-weight:800; vertical-align:middle; }
    .details { min-height:2.7em; margin:0; color:#c2d0db; font-size:.82rem; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .release { color:#a4bdce; font-size:.76rem; }
    .facts { display:grid; gap:3px; padding-top:2px; color:#91aabd; font-size:.72rem; }
    .fact { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .fact b { color:#d4e4ef; font-weight:650; }
    .score { color:#ccf270; }
    .gallery { display:grid; grid-template-rows:minmax(100px,1fr) 50px; gap:5px; padding:8px 8px 8px 0; min-height:205px; }
    .shot-main, .shot-thumb { overflow:hidden; background:#0b171f; border-radius:3px; }
    .shot-main img, .shot-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .empty-shot { display:grid; place-items:center; background:linear-gradient(135deg,#162b3a,#0a141b); }
    .empty-shot:after { content:"Steam image unavailable"; color:#658297; font-size:.72rem; }
    .thumbnails { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:auto; }
    .action { text-decoration:none; white-space:nowrap; text-align:center; padding:9px 7px; border-radius:5px; font-size:.82rem; font-weight:700; }
    .steam { color:#102411; background:var(--green); }
    .store { color:#d7efff; background:#275a78; }
    .action:hover { filter:brightness(1.12); }
    .empty { padding:44px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:10px; }
    footer { padding:4px 0 40px; color:var(--muted); font-size:.85rem; }
    @media (max-width:820px) { .game { grid-template-columns:145px 1fr; } .gallery { grid-column:1 / -1; grid-row:2; padding:0 8px 8px; min-height:190px; grid-template-rows:1fr 50px; } }
    @media (max-width:560px) { header { padding-top:36px; } .wrap { width:min(100% - 20px,1180px); } .game { grid-template-columns:1fr; } .cover { min-height:205px; } .gallery { grid-column:auto; grid-row:auto; min-height:180px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Extra Steam Games</h1>
    </header>
    <div class="summary"><span id="count"></span><span>Steam buttons may ask your browser to open Steam.</span></div>
    <section id="games" aria-live="polite"></section>
    <footer>Steam and the Steam logo are trademarks of Valve Corporation. This independent list is not affiliated with Valve.</footer>
  </main>
  <script>
    const games = [
      ["112 Operator",793460],["911 Operator",503560],["AER Memories of Old",331870],["Aces and Adventures",1815570,2],["Achtung! Cthulhu Tactics",874460],["Afterplace",2721530],["Alba: A Wildlife Adventure",1337010],["Alfred Hitchcock - Vertigo",1449320],["Amnesia: Rebirth",999220],["Aquarium Designer",1339000],["Arcade Paradise",1388870],["Asterix & Obelix XXL 1",1261520],["Asterix XXL 2",887060],["BZZZT",1293170],["Bahnsen Knights",1933190,2],["Balrum",424250],["Barrow Hill: The Dark Path",520990],["Bee Simulator",914750],["Biped",1071870],["Black Book",1138660],["Blacksad: Under the Skin",1003890],["Breathedge",738520],["Brothers: Two Sons",225080],["CARNAGE OFFERING TD",2298300],["Call of Cthulhu Retail",399810],["Cardpocalypse",904400],["Chess Ultra",518060],["Chicken Invaders 2",449550],["Chicken Invaders 5",353090],["Circle Empires Rivals",1100260],["Crash Time III Comp",33620],["DOOM 3",208200],["DOOM 64",1148590],["DOOMBLADE",922050],["Dark Deity",1374840],["Delivery INC",1793260],["Desert Child",844050],["Dishonored WW",205100],["Distrust",635200],["Everdream Valley",1403650],["Fall of Porcupine",1710540],["Fargone",2242100],["FootLOL: Epic Soccer League",263740],["Fractured Minds",688740],["Future Breach 3D",2335790],["GRIP: Combat Racing Launch",396900],["GT Racing 1980",3037960],["Galactic Glitch",1536620],["Golden Chambers",2437570],["Golf Club Nostalgia",1556870],["Gori: Cuddly Carnage",1299690],["Hell Pie",889910],["How 2 Escape",2264140],["How to Say Goodbye",1709700],["In Sound Mind",1119980],["In Sound Mind Deluxe Edition - Retail Key",1119980],["Insurmountable",1385100],["Internet Cafe Simulator",1136160],["Iron Danger",899310],["Kerbal Space Program",220200],["King of Dragon Pass",352220],["Kingsgrave",2644360],["Knock'Em Out",2192900],["Lake (Global)",1118240],["Metro Exodus",412020],["Moon Hunters",320040],["Murky Divers",2963880],["Nex Machina",404540],["Not a Monster: First Contact",826600],["Nuclear Dawn",17710],["Operation: Polygon Storm",2310160],["Our World Is Ended",940650],["Out of Space",400080],["Oxygen",2061430],["PGA Tour 2K21",1016120],["Partisans 1941",1227530],["Pinball Spire",2601940],["PlateUp!",1599600],["Police Stories",539470],["Popup Dungeon",349730],["Pumpkin Jack",1186640],["Quadroids",2419690],["Radio Commander",871530],["Rage Retail",9200],["Ring of Pain",998740],["Rustler",844260],["Rustler(Grand Theft Horse)",844260],["SUPERHOT",322500],["SYSTEM SHOCK: ENHANCED",410710],["Shadow Tactics: BladesoftheShogun",418240],["Silent Sector",1159680],["Snow Moto Racing Freedom",587400],["Soda Crisis",1592670],["Song of Farca",1435670],["Sophia the Traveler",1602540],["Spyro Reignited Trilogy",996580],["Steal The Pig",3585400],["Still There",1063490],["Stray Path (ROW)",2531940],["Streamer Life Simulator",1261040],["Supraland",813630],["Survivalist: Invisible Strain",1054510],["Syberia",46500],["Tempest: Pirate Action RPG",418180],["Teslagrad 2",1698220],["The Adventure of NAYU",1476340],["The Sandbox of God: Legacy Edition",840730],["The Shapeshifting Detective",898650],["The Wild Eight",526160],["The Witness",210970],["This War of Mine",282070],["Three Fourths Home: Extended Edition",344500],["Time Loader",1301950],["Tiny Robots Recharged",1709580],["Toki",1058320],["TombStar",1165470],["Tools Up!",1004490],["Train Valley",353640],["Train Valley 2",602320],["Tropico 3 Retail",23490],["Tunche",887450],["Vampire: The Masquerade",532790],["Verne: The Shape of Fantasy",1424600],["Wandersong",530320],["Wargroove",607050],["West of Dead",1016790],["Windward",326410],["Wizard of Legend",445980],["Wolfenstein 3D",2270],["Yesterday Origins",465280],["Yoku's Island Express",334940]
    ].map(([name,id,quantity=1,url]) => ({name,id,quantity,url:url || `https://store.steampowered.com/app/${id}/`}));

    const list = document.querySelector('#games'), count = document.querySelector('#count');
    const esc = value => value.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function render() {
      let visible = games;
      visible = [...visible].sort((a,b) => a.name.localeCompare(b.name));
      const total = visible.reduce((sum,game) => sum + game.quantity,0);
      count.textContent = `${visible.length} ${visible.length === 1 ? 'title' : 'titles'} · ${total} ${total === 1 ? 'key' : 'keys'}`;
      list.innerHTML = visible.map(g => `<article class="game" data-appid="${g.id || ''}"><div class="cover${g.id ? '' : ' no-art'}"><span class="cover-title">${esc(g.name)}</span>${g.id ? `<img src="https://cdn.cloudflare.steamstatic.com/steam/apps/${g.id}/library_600x900.jpg" alt="" loading="lazy" onerror="this.src='https://cdn.cloudflare.steamstatic.com/steam/apps/${g.id}/header.jpg'; this.onerror=() => { this.parentElement.classList.add('no-art'); this.remove(); }">` : ''}</div><div class="card-body"><h2 class="title">${esc(g.name)}${g.quantity > 1 ? `<span class="badge">${g.quantity}×</span>` : ''}</h2><p class="details">${g.id ? 'Loading Steam details…' : 'Steam search result'}</p><div class="release"></div><div class="facts"></div><div class="actions">${g.id ? `<a class="action steam" href="steam://store/${g.id}">Open in Steam</a>` : `<span class="action steam" title="Steam client link unavailable for search results">Steam search</span>`}<a class="action store" href="${g.url}" target="_blank" rel="noopener noreferrer">Store page ↗</a></div></div><div class="gallery"><div class="shot-main"></div><div class="thumbnails"><div class="shot-thumb"></div><div class="shot-thumb"></div><div class="shot-thumb"></div></div></div></article>`).join('');
      hydrateVisibleCards();
    }
    const detailsCache = new Map();
    let libraryRequest;
    async function getDetails(appid) {
      appid = String(appid);
      if (detailsCache.has(appid)) return detailsCache.get(appid);
      if (!libraryRequest) libraryRequest = fetch('./game-data.json').then(response => {
        if (!response.ok) throw new Error('Game metadata is unavailable');
        return response.json();
      }).then(records => {
        Object.entries(records).forEach(([id, data]) => detailsCache.set(id, data));
      });
      await libraryRequest;
      return detailsCache.get(appid) || null;
    }
    async function hydrateCard(card) {
      const appid = card.dataset.appid;
      if (!appid || card.dataset.loaded) return;
      card.dataset.loaded = 'true';
      try {
        let data = detailsCache.get(appid);
        if (!data) {
          data = await getDetails(appid);
        }
        if (!data) throw new Error('No Steam details');
        const description = card.querySelector('.details');
        const release = card.querySelector('.release');
        const facts = card.querySelector('.facts');
        const gallery = card.querySelector('.gallery');
        const coverImage = card.querySelector('.cover img');
        const price = data.is_free ? 'Free to play' : data.price_overview?.final_formatted || 'Price unavailable';
        const platforms = Object.entries(data.platforms || {}).filter(([, available]) => available).map(([platform]) => platform === 'windows' ? 'Windows' : platform[0].toUpperCase() + platform.slice(1)).join(', ');
        const developer = data.developers?.[0] || '';
        const publisher = data.publishers?.[0] || '';
        const score = data.metacritic?.score ? `<span class="fact score"><b>Metacritic</b> ${data.metacritic.score}</span>` : '';
        description.textContent = data.short_description || 'View this title on Steam.';
        release.textContent = data.release_date?.date ? `Released ${data.release_date.date}` : '';
        if (data.header_image && coverImage) coverImage.src = data.header_image;
        facts.innerHTML = `<span class="fact"><b>Price</b> ${esc(price)}</span>${developer ? `<span class="fact" title="${esc(developer)}"><b>Dev</b> ${esc(developer)}</span>` : ''}${publisher ? `<span class="fact" title="${esc(publisher)}"><b>Publisher</b> ${esc(publisher)}</span>` : ''}${platforms ? `<span class="fact" title="${esc(platforms)}"><b>Platforms</b> ${esc(platforms)}</span>` : ''}${score}`;
        const shots = (data.screenshots || []).slice(0, 4).map(shot => shot.path_full);
        if (shots.length) {
          gallery.querySelector('.shot-main').innerHTML = `<img src="${esc(shots[0])}" alt="Screenshot from ${esc(data.name)}" loading="lazy" onerror="this.parentElement.classList.add('empty-shot');this.remove()">`;
          gallery.querySelectorAll('.shot-thumb').forEach((thumb, index) => { if (shots[index + 1]) thumb.innerHTML = `<img src="${esc(shots[index + 1])}" alt="" loading="lazy" onerror="this.parentElement.classList.add('empty-shot');this.remove()">`; });
        } else { gallery.style.display = 'none'; }
      } catch {
        card.querySelector('.details').textContent = 'Visit the Steam Store page for game details.';
      }
    }
    function hydrateVisibleCards() {
      const cards = [...list.querySelectorAll('[data-appid]')];
      if (!('IntersectionObserver' in window)) { cards.slice(0, 12).forEach(hydrateCard); return; }
      const observer = new IntersectionObserver(entries => entries.forEach(entry => { if (entry.isIntersecting) { hydrateCard(entry.target); observer.unobserve(entry.target); } }), { rootMargin: '300px' });
      cards.forEach(card => { if (card.dataset.appid) observer.observe(card); });
    }
    render();
  </script>
</body>
</html>
